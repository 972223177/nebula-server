services:
  mysql:
    image: mysql:8.0
    container_name: nebula-mysql
    environment:
      # 与 server 的 DB_PASSWORD 同源，统一从项目根 .env 注入（缺失时兜底 root123，仅本地开发）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: nebula
      # 时区与 server 保持一致（Asia/Shanghai, UTC+8），避免两端时区不同导致 timestamp 列 8 小时漂移
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nebula-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: nebula-server
    ports:
      - "9090:9090"
    environment:
      # Docker 容器网络内用服务名通信，覆盖 application.conf 的 127.0.0.1
      DB_HOST: mysql
      REDIS_HOST: redis
      # DB 密码与 mysql 容器 MYSQL_ROOT_PASSWORD 同源，统一从 .env 注入（缺失时兜底 root123，仅本地开发）
      # 显式注入避免只依赖 dev.conf 兜底：一旦 ENV=prod（不加载 dev.conf）也能正常连库
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      # 外部服务 Key：从 host 环境变量 / 本地 .env 注入（与 DB_PASSWORD 同模式，不写死在仓库）
      QWEATHER_API_KEY: ${QWEATHER_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY}
      # 开发环境，自动加载 config/dev.conf 的默认密码
      ENV: dev
      # 容器时区设为北京时间（UTC+8）：JVM 默认时区与 logback 时间戳均跟随 TZ，
      # 修复容器内日志比本机慢 8 小时（原默认 UTC）的问题
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 挂载配置文件方便热改，无需重建镜像
    volumes:
      - ./config:/app/config:ro

volumes:
  mysql-data:

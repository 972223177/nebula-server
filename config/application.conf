env = ${?ENV}

server {
    port = 9090
    port = ${?SERVER_PORT}
}

snowflake {
    worker-id = 1
    worker-id = ${?SNOWFLAKE_WORKER_ID}
    epoch = 1700000000000
}

database {
    host = "127.0.0.1"
    host = ${?DB_HOST}
    port = 3306
    port = ${?DB_PORT}
    database = "nebula"
    database = ${?DB_NAME}
    username = "root"
    username = ${?DB_USER}
    # D-77: 生产环境不提供默认密码，缺失时启动即报错
    password = ${?DB_PASSWORD}
    # MySQL SSL 连接，默认 false（D-77: 开发环境禁用，生产环境需设为 true + VERIFY_CA）
    ssl = false
    ssl = ${?DB_SSL}
    pool-size = 20
    pool-size = ${?DB_POOL_SIZE}
    min-idle = 5
    min-idle = ${?DB_MIN_IDLE}
    connection-timeout = 30000
    connection-timeout = ${?DB_CONNECTION_TIMEOUT}
    idle-timeout = 600000
    idle-timeout = ${?DB_IDLE_TIMEOUT}
    max-lifetime = 1800000
    max-lifetime = ${?DB_MAX_LIFETIME}
    leak-detection-threshold = ${?DB_LEAK_DETECTION_THRESHOLD}
}

redis {
    host = "127.0.0.1"
    host = ${?REDIS_HOST}
    port = 6379
    port = ${?REDIS_PORT}
    # D-77: Redis 密码仅在需要时通过环境变量提供（开发环境免密码）
    password = ${?REDIS_PASSWORD}
    # Redis TLS 连接，默认 false（D-77）
    ssl = false
    ssl = ${?REDIS_SSL}
}

ssl {
    enabled = false
    enabled = ${?SSL_ENABLED}
    cert-chain-path = "config/dev/ssl/fullchain.pem"
    cert-chain-path = ${?SSL_CERT_CHAIN_PATH}
    private-key-path = "config/dev/ssl/privkey.pem"
    private-key-path = ${?SSL_PRIVATE_KEY_PATH}
}

sensitive-word {
    # 内嵌基线词库资源路径（classpath 下），随 jar 打包，服务端启动时优先加载，不依赖外网。
    # 默认指向 common/src/main/resources/sensitive/builtin-words.txt，可直接编辑该文件扩充词库。
    resource-path = "sensitive/builtin-words.txt"

    # 可选远程词库覆盖源（一行一词的 raw 文本）。留空则完全不发起网络请求，仅用内嵌词库。
    # 注意：Gitee 等平台的 raw 文件对服务端 HTTP 客户端整体封锁（Access denied），
    # 故默认留空。如需远程覆盖，请配置一个服务端可达的地址（或经 SENSITIVE_WORD_SOURCE_URL 注入）。
    source-url = ${?SENSITIVE_WORD_SOURCE_URL}
}

# 外部服务（和风天气 / Serper 搜索）—— 详见 external-service-backend.md
# 所有密钥仅经环境变量注入，缺失时启动即报错（与 database.password 同模式）
external-service {
    # ─── 和风天气（主源，有 Key + 配额） ───
    qweather {
        # 和风天气 API Key，仅经环境变量注入。留空时天气功能降级为 wttr.in（免费无 Key）。
        api-key = ${?QWEATHER_API_KEY}
        # 基础地址（免费订阅用 devapi 域名）
        base-url = "https://devapi.qweather.com"
        base-url = ${?QWEATHER_BASE_URL}
        # 上游 HTTP 超时（毫秒）
        timeout-ms = 5000
        timeout-ms = ${?QWEATHER_TIMEOUT_MS}
    }
    # ─── wttr.in（兜底层，免费无 Key，替换原 Open-Meteo） ───
    # 提供实况 + 3 天预报，支持 ?lang=zh 中文描述；不含 AQI/预警/生活指数，降级时这些字段缺省跳过。
    wttr {
        # 基础地址
        base-url = "https://wttr.in"
        base-url = ${?WTTR_BASE_URL}
        # 返回语言，默认 zh（中文天气描述，贴合 IM 场景）
        lang = "zh"
        lang = ${?WTTR_LANG}
        # 上游 HTTP 超时（毫秒）
        timeout-ms = 5000
        timeout-ms = ${?WTTR_TIMEOUT_MS}
    }
    # ─── Serper 搜索（有 Key，无免费兜底） ───
    serper {
        # Serper 搜索 API Key，仅经环境变量注入。留空时搜索功能返回 SERVICE_UNAVAILABLE。
        api-key = ${?SERPER_API_KEY}
        # 基础地址
        base-url = "https://google.serper.dev"
        base-url = ${?SERPER_BASE_URL}
        # 上游 HTTP 超时（毫秒）
        timeout-ms = 8000
        timeout-ms = ${?SERPER_TIMEOUT_MS}
    }
    quota {
        # 配额持久化文件路径（仅 Redis 降级兜底用，正常部署不依赖），默认 ~/.nebula/external_service_quota.yaml
        file-path = "~/.nebula/external_service_quota.yaml"
        file-path = ${?EXTERNAL_QUOTA_FILE_PATH}
        # 预警百分比（用量达到此比例时进入预警态），默认 80
        warning-threshold = 80
        warning-threshold = ${?EXTERNAL_QUOTA_WARNING}
        # 拒绝百分比（用量达到此比例时返回 QUOTA_EXCEEDED），默认 95
        reject-threshold = 95
        reject-threshold = ${?EXTERNAL_QUOTA_REJECT}
        # 和风天气全局共享日上限，默认 1000（全体用户共用一个池，非每用户）
        weather-daily-limit = 1000
        weather-daily-limit = ${?QWEATHER_DAILY_LIMIT}
        # Serper 全局共享月上限，默认 2500（全体用户共用一个池，非每用户）
        search-monthly-limit = 2500
        search-monthly-limit = ${?SEARCH_MONTHLY_LIMIT}
        # 每用户天气日上限（防御子限，须 ≤ weather-daily-limit，防单用户烧光共享池），默认 50
        weather-per-user-daily-limit = 250
        weather-per-user-daily-limit = ${?WEATHER_PER_USER_DAILY_LIMIT}
        # 每用户搜索月上限（防御子限，须 ≤ search-monthly-limit），默认 100
        search-per-user-monthly-limit = 500
        search-per-user-monthly-limit = ${?SEARCH_PER_USER_MONTHLY_LIMIT}
        # 配额刷盘间隔（秒），默认 10；越小崩溃丢失越少，越大 IO 越少
        flush-interval-seconds = 10
        flush-interval-seconds = ${?EXTERNAL_QUOTA_FLUSH_INTERVAL}
    }
    # ─── 缓存（L1 本地 LRU + L2 Redis 二级） ───
    cache {
        # L1：本地内存 LRU（快路径，避免每次都打 Redis）
        l1 {
            # 天气 L1 TTL（秒），默认 120（2 分钟）
            weather-ttl-seconds = 120
            weather-ttl-seconds = ${?WEATHER_L1_TTL}
            # 搜索 L1 TTL（秒），默认 300（5 分钟）
            search-ttl-seconds = 300
            search-ttl-seconds = ${?SEARCH_L1_TTL}
            # 最大条目数，默认 100
            max-entries = 100
            max-entries = ${?EXTERNAL_CACHE_MAX_ENTRIES}
        }
        # L2：Redis（共享跨实例 + 跨重启复用，真正省配额）
        l2 {
            # Redis 键前缀，避免与其它业务冲突
            key-prefix = "ext:"
            key-prefix = ${?EXTERNAL_CACHE_KEY_PREFIX}
            # 天气 L2 TTL（秒），默认 1800（30 分钟）
            weather-ttl-seconds = 1800
            weather-ttl-seconds = ${?WEATHER_L2_TTL}
            # GeoAPI 城市→LocationID L2 TTL（秒），默认 86400（24h）
            geo-ttl-seconds = 86400
            geo-ttl-seconds = ${?GEO_L2_TTL}
            # 搜索 L2 默认 TTL（秒），默认 3600（1 小时，兜底未分类 query）
            search-ttl-seconds = 3600
            search-ttl-seconds = ${?SEARCH_L2_TTL}
            # 搜索 L2 稳定类 TTL（秒），默认 21600（6 小时，search 普通网页，最长复用省调用）
            search-stable-ttl-seconds = 21600
            search-stable-ttl-seconds = ${?SEARCH_L2_STABLE_TTL}
            # 搜索 L2 时效类 TTL（秒），默认 600（10 分钟，news 类型时效敏感）
            search-news-ttl-seconds = 600
            search-news-ttl-seconds = ${?SEARCH_L2_NEWS_TTL}
        }
    }
}

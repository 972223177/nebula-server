syntax = "proto3";

package com.nebula.chat.external;

option java_multiple_files = true;
option java_package = "com.nebula.chat.external";

// ============================================================================
// 外部服务集成（天气 / 网页搜索）—— 仅新增 message，不新增 gRPC service。
//
// 项目传输仅 ChatService.chat(stream Envelope) returns (stream Envelope) 双向流
// （见 nebula/chat_service.proto），所有业务经 Envelope 进出：
//   请求：Request.method = "external/query_weather"（或 "external/web_search"），
//        params = WeatherRequest.toByteArray()（bytes 负载，由 ProtoCodec 按 Handler 泛型反序列化）；
//   响应：Response.result = WeatherResponse.toByteArray()（由 ProtoCodec 按 Handler 泛型序列化），
//        code/msg 走统一 BizCode。
//
// 错误码（common/BizCode.kt 16xx 段，由 ExceptionInterceptor 统一写入 Response.code/msg）：
//   QUOTA_EXCEEDED(1600)      免费配额已用完（msg 折叠剩余重置秒数）
//   SERVICE_UNAVAILABLE(1601) 服务暂时不可用（Key 缺失 / 超时 / 熔断降级失败）
//   INVALID_CITY(1602)        城市不存在
//   RATE_LIMITED(1004)        限流 / 上游 429 退避（复用既有码）
// ============================================================================

// ─── 天气查询 ───

// external/query_weather 请求。
message WeatherRequest {
  string city = 1;          // 城市名，如 "北京"
}

// external/query_weather 响应。
message WeatherResponse {
  string formatted = 1;     // 格式化天气文本，直接注入 LLM context
  // 格式示例：
  // 北京（北京市）
  // 当前晴，25°C（体感23°C）
  // 未来三天：2026-07-15: 晴 22~31°C；2026-07-16: 多云 23~30°C
  // 分钟降水：未来2小时无降水
  // 空气质量：AQI 35（等级1），PM2.5 25μg/m³
  // 天气预警：无
  // 生活指数：穿衣：1 舒适；紫外线：2 中等；感冒：1 低发
  // 日出：05:30 日落：19:45，月相：亏凸月
}

// ─── 网页搜索 ───

// external/web_search 请求。
message SearchRequest {
  string query = 1;         // 用户搜索词
  int32 max_results = 2;    // 最大结果数，默认 5（Serper 支持 1-10，服务端裁剪到 [1,10]）
  string search_type = 3;   // 搜索类型：search（默认网页）、news（新闻）等，服务端白名单校验
}

message SearchResultItem {
  string title = 1;         // 标题
  string snippet = 2;       // 摘要
  string url = 3;           // 来源链接
}

// external/web_search 响应。
message SearchResponse {
  string formatted = 1;                 // 格式化搜索结果文本，直接注入 LLM context
  repeated SearchResultItem items = 2;  // 结构化结果（可选）
  // formatted 格式示例：
  // 搜索结果（共 5 条）：
  // 1. [标题] ...摘要...
  // 2. [标题] ...摘要...
}

// ─── IP 定位查询 ───

// external/geo_ip 请求。
// 此接口响应不包含业务参数（无 params 字段），仅通过 Response.code 和 Response.msg 表示操作结果。
// IP 由服务端从连接元数据（x-client-ip / x-forwarded-for）提取客户端真实 IP，客户端无需传参。
message IpLocationRequest {
  // 故意留空：IP 来源于服务端，不接收客户端传入（避免客户端伪造定位）。
}

// external/geo_ip 响应。
message IpLocationResponse {
  string formatted = 1;   // 格式化定位文本，直接注入 LLM context，如 "中国 广东 深圳（114.06,22.54）时区Asia/Shanghai 运营商xxx"
  string country = 2;     // 国家（中文或英文，取决于上游），如 "中国"
  string region = 3;      // 省/州，如 "广东省"
  string city = 4;        // 城市，如 "深圳市"
  double latitude = 5;    // 纬度
  double longitude = 6;   // 经度
  string timezone = 7;    // IANA 时区，如 "Asia/Shanghai"
  string isp = 8;         // 运营商 / 组织，如 "China Telecom"
}

// ============================================================================
// 服务发现与通用调用（LLM Agent Function Calling 支撑，Phase 10）
//
// 不新增 gRPC service，仍走 ChatService.chat 双向流的 Envelope 进出：
//   - external/list_services：Request.method="external/list_services"，
//       params=ListServicesRequest.toByteArray()，result=ListServicesResponse.toByteArray()
//   - external/call_service：Request.method="external/call_service"，
//       params=CallServiceRequest.toByteArray()，result=CallServiceResponse.toByteArray()
//
// 设计要点：
//   - ServiceDescriptor 是「可被 LLM 自主调用的工具」的统一契约描述，由 list_services 下发给客户端；
//     客户端据此把工具暴露给 LLM，由 LLM 决定何时调用，无需在服务端写死调用逻辑。
//   - 现有 3 个内置服务（weather / web_search / geo_ip）已注册进注册表，随版本发布自动被客户端发现；
//     后续新增服务只需在注册表登记，客户端无需改动即可获得新能力。
//   - call_service 按 service_id 路由、用 params_json 传参，result_json 为通用 JSON 字符串；
//     params_json 必须与该服务 input_schema_json 一致，result_json 结构由 output_schema_json 描述。
//   - 错误码：未知 service_id → NOT_FOUND(1003)；params_json 非法（非 JSON / 非对象 / 缺必填 / 类型不符）
//     → INVALID_PARAM(1000)；上游配额用尽 / 不可用 / 限流 → 复用既有 SERVICE_UNAVAILABLE / QUOTA_EXCEEDED / RATE_LIMITED 段。
// ============================================================================

// 服务风险等级，审批唯一裁决源（封闭集合，禁止用 string 表达，避免拼写漂移）。
enum RiskLevel {
  RISK_LEVEL_UNKNOWN = 0;           // 未知/未设置（proto3 哑值，不应在业务中出现）
  LOW = 1;                          // 低风险：只读、无副作用（如天气/搜索/地理定位）
  MID = 2;                          // 中风险：可能产生可回滚的副作用
  HIGH = 3;                         // 高风险：不可回滚的副作用或敏感操作
}

// 单个可被 LLM 调用的外部服务描述（工具定义）。
message ServiceDescriptor {
  string id = 1;                    // 稳定唯一 id（snake_case），等于 LLM tool name，如 "weather"
  string name = 2;                  // 友好显示名，如 "天气查询"
  string description = 3;           // 清晰描述能力边界，决定 LLM 调用准确率（必填且须准确）
  string category = 4;              // 分类，如 "weather" / "web_search" / "utility"
  string input_schema_json = 5;     // 合法 JSON Schema 字符串，描述 params_json 结构（须与实际一致）
  string output_schema_json = 6;    // 合法 JSON Schema 字符串，描述 result_json 结构（须与实际一致）
  RiskLevel risk_level = 7;         // 风险等级（审批唯一裁决源），须 = (requires_user_consent == false ? LOW : 非 LOW)
  string version = 8;               // 描述版本，变更时客户端可据此判断兼容性
  bool requires_user_consent = 9;   // 是否需要用户确认，须与 risk_level 一致：LOW 时恒 false，非 LOW 时恒 true（冗余一致性）
}

// external/list_services 请求。
message ListServicesRequest {
  string category = 1;              // 按分类过滤（空表示不按分类过滤）
  bool only_available = 2;          // 仅返回当前可用（当前所有服务视为可用，字段保留待实时可用性探测）
  repeated string ids = 3;          // 按 id 列表精确拉取（空表示返回全部）
  string search_keyword = 4;        // 按关键字模糊过滤 name/description（空表示不过滤）
}

// external/list_services 响应。
message ListServicesResponse {
  repeated ServiceDescriptor services = 1;  // 当前可用工具清单
  int64 cache_ttl_seconds = 2;              // 客户端缓存建议 TTL（秒）
  string version_hash = 3;                 // 完整内容哈希，任一字段变化即变，客户端据此判断是否重拉
}

// external/call_service 请求。
message CallServiceRequest {
  string service_id = 1;            // 目标服务 id（即 ServiceDescriptor.id）
  string params_json = 2;           // 调用参数 JSON，须符合该服务 input_schema_json
}

// external/call_service 响应。
message CallServiceResponse {
  string result_json = 1;           // 调用结果 JSON，须符合该服务 output_schema_json
}

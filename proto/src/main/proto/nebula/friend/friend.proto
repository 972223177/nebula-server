syntax = "proto3";

package com.nebula.chat.friend;

option java_multiple_files = true;
option java_package = "com.nebula.chat.friend";

// ---- friend/add ----
// 发送好友申请
message FriendAddReq {
  int64 to_uid = 1;                   // 目标用户 UID
  string message = 2;                 // 好友申请附言
}

// 好友申请响应
message FriendAddResp {
  int64 request_id = 1;               // 好友申请 ID
}

// ---- friend/accept ----
// 同意好友申请
// 此接口响应不包含业务数据（无 result 字段），仅通过 Response.code 和 Response.msg 表示操作结果
message FriendAcceptReq {
  int64 request_id = 1;               // 好友申请 ID
}

// ---- friend/reject ----
// 拒绝好友申请
// 此接口响应不包含业务数据（无 result 字段），仅通过 Response.code 和 Response.msg 表示操作结果
message FriendRejectReq {
  int64 request_id = 1;               // 好友申请 ID
}

// ---- friend/delete ----
// 删除好友
// 此接口响应不包含业务数据（无 result 字段），仅通过 Response.code 和 Response.msg 表示操作结果
message FriendDeleteReq {
  int64 uid = 1;                      // 好友 UID
}

// ---- friend/list ----
// 获取好友列表，支持游标分页（D-46）
message FriendListReq {
  int64 cursor = 1;                    // 游标，首次请求传 0
  int32 limit = 2;                    // 每页数量
}

// 好友列表响应
message FriendListResp {
  repeated FriendBrief friends = 1;   // 好友简要信息列表
  int64 next_cursor = 2;              // 下一页游标，无更多时为 0（D-46）
  bool has_more = 3;                  // 是否还有更多数据
}

// 好友简要信息
message FriendBrief {
  int64 uid = 1;                      // 好友 UID
  string username = 2;                // 好友用户名
  string display_name = 3;            // 好友显示昵称
  string avatar_url = 4;              // 好友头像 URL
  int32 status = 5;                   // 在线状态：0=离线 1=在线 2=隐藏
  int64 created_at = 6;               // 成为好友的时间（毫秒时间戳）
}

// ---- friend/requests ----
// 获取好友申请列表（支持按方向过滤）

// 申请方向
enum FriendRequestDirection {
  INCOMING = 0;                       // 收到的申请（默认）
  OUTGOING = 1;                       // 发出的申请
  BOTH = 2;                           // 双向
}

message FriendRequestsReq {
  FriendRequestDirection direction = 1; // 方向过滤，默认 INCOMING 兼容旧行为
}

// 好友申请列表响应
message FriendRequestsResp {
  repeated FriendRequestItem requests = 1; // 好友申请列表
}

// 好友申请条目
message FriendRequestItem {
  int64 request_id = 1;               // 申请 ID
  int64 from_uid = 2;                 // 对方 UID（INCOMING=申请发起方，OUTGOING=申请接收方）
  string from_username = 3;           // 对方用户名
  string from_avatar = 4;             // 对方头像 URL
  string message = 5;                 // 申请附言
  string status = 6;                  // 申请状态：pending / accepted / rejected
  int64 created_at = 7;               // 申请时间（毫秒时间戳）
  FriendRequestDirection direction = 8; // 申请方向（新增字段，默认 INCOMING 兼容旧客户端）
}

// ========================================
// 推送 Payload 消息（D-49, D-50）
// ========================================

// 好友申请推送载荷（pushEventType = FRIEND_REQUEST）
message FriendRequestPayload {
  int64 request_id = 1;               // 好友申请 ID
  int64 from_uid = 2;                 // 申请人 UID
  string from_username = 3;           // 申请人用户名
  string from_avatar = 4;             // 申请人头像 URL
  string message = 5;                 // 申请附言
}

// 好友接受推送载荷（pushEventType = FRIEND_ACCEPTED）
message FriendAcceptedPayload {
  int64 uid = 1;                      // 接受方 UID
  string conversation_id = 2;         // 新建/恢复的私聊会话 ID（D-43）
}

// 在线状态变更推送载荷（pushEventType = STATUS_CHANGED）
message StatusChangedPayload {
  int64 uid = 1;                      // 状态变更用户 UID
  int32 status = 2;                   // 在线状态：0=离线 1=在线 2=隐藏（D-57）
}

// ---- friend/check ----
// 查询两个用户间的关系状态

// 关系状态枚举
enum FriendRelationStatus {
  FRIEND = 0;               // 已是好友
  PENDING_SENT = 1;         // 我发起了申请，等待对方同意
  PENDING_RECEIVED = 2;     // 对方发起了申请，等待我同意
  REJECTED = 3;             // 申请已被拒绝
  NONE = 4;                 // 无任何关系
}

message FriendCheckRelationReq {
  int64 uid = 1;                      // 目标用户 UID
}

message FriendCheckRelationResp {
  FriendRelationStatus status = 1;    // 关系状态
  int64 request_id = 2;               // 关联的申请 ID（仅 PENDING_SENT/PENDING_RECEIVED/REJECTED 时有效）
}

// ---- friend/batchCheck ----
// 批量查询当前用户与多个目标用户的关系状态

message FriendBatchCheckRelationReq {
  repeated int64 uids = 1;            // 目标用户 UID 列表
}

message FriendBatchCheckRelationResp {
  repeated FriendRelationItem items = 1;
}

message FriendRelationItem {
  int64 uid = 1;                      // 目标用户 UID
  FriendRelationStatus status = 2;    // 关系状态
  int64 request_id = 3;               // 关联的申请 ID
}

syntax = "proto3";

package com.nebula.chat.group;

option java_multiple_files = true;
option java_package = "com.nebula.chat.group";

// 群成员角色（封闭集合，权限裁决唯一源，禁止用 string 表达避免拼写漂移）。
enum GroupMemberRole {
  GROUP_MEMBER_ROLE_UNKNOWN = 0;      // 未知/未设置（proto3 哑值）
  OWNER = 1;                          // 群主：拥有群全部管理权限
  ADMIN = 2;                          // 管理员：部分管理权限（预留，当前写入路径未启用）
  MEMBER = 3;                         // 普通成员
}

// 群成员信息
message GroupMember {
  int64 uid = 1;                      // 成员 UID
  string username = 2;                // 成员用户名
  string display_name = 3;            // 成员显示昵称
  string avatar_url = 4;              // 成员头像 URL
  GroupMemberRole role = 5;           // 成员角色（枚举值见 GroupMemberRole）
  int64 joined_at = 6;                // 加入时间（毫秒时间戳）
}
